[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eng-hours-estimator"
version = "0.1.0"
description = "LLM-as-a-judge estimation of human-equivalent engineering hours per merged PR, from git history."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "openai>=1.60",
    "google-genai>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
eng-hours = "eng_hours.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
